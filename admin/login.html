<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Admin Login | Dynamic Portfolio</title>
  <meta name="description" content="Admin login for managing dynamic portfolio content.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
  <main class="login-page">
    <div class="login-box">
      <div class="text-center mb-4">
        <div class="mini-icon mx-auto"><i class="bi bi-shield-lock"></i></div>
        <h1 class="h3 fw-black mb-2">Admin Login</h1>
        <p class="text-muted mb-0">Manage your full dynamic portfolio website from one dashboard.</p>
      </div>
      <div class="alert alert-info rounded-4 small">
        Demo login:<br>
        Email: <strong>admin@example.com</strong><br>
        Password: <strong>admin123</strong>
      </div>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" value="admin@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" value="admin123" required>
        </div>
        <button type="submit" class="btn-primary-custom w-100">Login to Dashboard</button>
      </form>
      <div class="text-center mt-4">
        <a href="../index.html" class="text-decoration-none fw-semibold"><i class="bi bi-arrow-left"></i> Back to Website</a>
      </div>
    </div>
  </main>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
